# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: portfolio-reviewer
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_API_URL
        value: http://localhost:8099
    disk:
      name: storage
      mountPath: /opt/render/project/src
      sizeGB: 1